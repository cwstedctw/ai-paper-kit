# push 到 GitHub，雲端自動跑一次 uv run build.py，編出論文 PDF。
# 到儲存庫的 Actions 頁面，點最新那一次，下面的 paper-pdf 就是 PDF。
# ⚠️ 資料會在 GitHub 的雲端機器上被讀取；受試者資料能不能這樣處理，先確認 IRB 與學校規範。
name: 編譯論文 PDF
on:
  push:
    paths:
      - "source/**"
      - "build.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安裝 LaTeX 與 gnuplot（只裝需要的部分）
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers \
            texlive-pictures texlive-fonts-recommended lmodern gnuplot-nox
      - name: 論文改用 xelatex（有中文）時，加裝中文排版與字型
        run: |
          if head -n 5 source/paper/main.tex | grep -qiE 'program *= *xelatex'; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              texlive-xetex texlive-lang-chinese fonts-noto-cjk
          fi
      - name: 安裝 uv（它照 pyproject.toml、uv.lock 裝 Python 和套件）
        uses: astral-sh/setup-uv@v6
      - name: 跑整條流程
        run: uv run build.py
      - name: 把 PDF 放到可以下載的地方
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: output/main.pdf
          retention-days: 30
